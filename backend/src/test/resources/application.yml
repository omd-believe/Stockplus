spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false   # H2 schema created by Hibernate ddl-auto

stockpulse:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long
    expiry-minutes: 60
  admin:
    email: testadmin@stockpulse.com
    password: TestAdmin@123
  risk:
    single-stock-limit-pct: 40
    sector-limit-pct: 60
    medium-risk-top-holding-pct: 30
    high-risk-top-holding-pct: 50
  market:
    impact-enabled: false
    depth-inr: 10000000
    max-impact-pct: 2.0
    min-price: 1.00
    drift:
      enabled: false
      interval-seconds: 10
      volatility-pct: 0.10
      mean-reversion: 0.02

